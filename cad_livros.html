<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="acessibilidade">
        <span>Acessibilidade: </span>
        <button onclick="aumentarFonte()">A+ (Aumentar Letra)</button>
        <button onclick="diminuirFonte()">A- (Diminuir Letra)</button>
        <button onclick="mudarContraste()">Alto Contraste</button>
    </div>

    <header>
        <h1>Biblioteca</h1>
        <p>Leitura, inclusão e audiobooks ao alcance de todos!</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="cad_leitores.html">Leitores</a>
        <a href="biblioteca.html">Biblioteca de Livros</a>
        <a href="cad_livros.html">Cadastrar Livros</a>
    </nav>

    <main>
        <div class="formulario">
            <h2>Cadastro de Livros</h2>

            <form onsubmit="cadastrar(event)">
                <label>Código:</label>
                <input type="text" placeholder="Digite o código" required>

                <label>Nome do Livro:</label>
                <input type="text" placeholder="Digite o nome do livro" required>

                <label>Categoria:</label>
                <select>
                    <option>Selecione</option>
                    <option>Ficção / Fantasia</option>
                    <option>Biografia / Música</option>
                    <option>Terror / Suspense</option>
                    <option>Literatura Brasileira</option>
                </select>

                <label>Possui versão em Áudio (Audiobook)?</label>
                <select>
                    <option>Sim (Livro Físico + Audiobook)</option>
                    <option>Apenas Audiobook</option>
                    <option>Apenas Livro Físico</option>
                </select>

                <label>Quantidade em Estoque:</label>
                <input type="number" placeholder="Digite a quantidade">

                <div class="botoes-form">
                    <button type="submit" class="botao">Cadastrar</button>
                    <button type="reset" class="botao-limpar">Limpar</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>©</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
